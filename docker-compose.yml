services:
  mysql:
    image: mysql:8.0
    container_name: african_scholar_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Prince123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-africanscholar}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend_Service
      dockerfile: Dockerfile
    container_name: african_scholar_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_URI: mysql://root:${MYSQL_ROOT_PASSWORD:-Prince123}@mysql:3306/${MYSQL_DATABASE:-africanscholar}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_african_scholar_2026}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      USER_CLIENT_URL: ${USER_CLIENT_URL:-http://localhost:3000}
      ADMIN_CLIENT_URL: ${ADMIN_CLIENT_URL:-http://localhost:3001}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_SECURE: ${SMTP_SECURE:-tls}
    ports:
      - "5000:5000"

  user_portal:
    build:
      context: ./user_service
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_ADMIN_URL: ${VITE_ADMIN_URL:-http://localhost:3001}
    container_name: african_scholar_user_portal
    restart: unless-stopped
    ports:
      - "3000:80"

  admin_portal:
    build:
      context: ./admin_service
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_USER_CLIENT_URL: ${VITE_USER_CLIENT_URL:-http://localhost:3000}
    container_name: african_scholar_admin_portal
    restart: unless-stopped
    ports:
      - "3001:80"

volumes:
  mysql_data:
